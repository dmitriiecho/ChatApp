# Memory for the Gradle daemon.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Builds independent modules in parallel.
org.gradle.parallel=true
# Skips the configuration phase when no build script changed.
org.gradle.configuration-cache=true
# Reuses task outputs from earlier builds (also between CI runs: setup-gradle saves the cache).
org.gradle.caching=true
# Parallel project sync in Android Studio.
org.gradle.tooling.parallel=true
kotlin.code.style=official
# Screenshot tests compare with the saved images on every `test` run, locally and in CI;
# ./gradlew recordRoborazziDebug saves new ones (chatapp.android.screenshots). Don't add
# roborazzi.cleanupOldScreenshots here: a filtered test run would delete the module's other images; it is passed
# with -P to the record command only.
roborazzi.test.verify=true
